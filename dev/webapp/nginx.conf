server {
    listen 8080;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── SPA routing ──────────────────────────────────────────────────────
    # Attempt the exact file, then directory, then fall back to index.html
    # so that client-side routes work on hard-refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API reverse proxy ─────────────────────────────────────────────────
    # Forward /api/* requests to the catalog-service backend container.
    # The path is preserved (no trailing slash rewrite), so
    # /api/products → http://app:3000/api/products.
    location /api/ {
        proxy_pass         http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for streaming responses (e.g. image streams)
        proxy_buffering    off;
    }
}
